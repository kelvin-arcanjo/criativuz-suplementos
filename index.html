<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criativuz_suplementos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <header>
    <h1>CRIATIVUZ SUPLEMENTOS</h1>
    <p class="slogan">Bom Suplemento é na Criativuz Suplementos, noutras lojas não!</p>
</header>
<nav class="filters-container">
    <input type="text" id="search-input" placeholder="Pesquisar produto...">
    <div class="category-pills">
        <button class="pill-btn active" data-category="todos">Todos</button>
        <button class="pill-btn active" data-category="proteinas">Proteínas</button>
        <button class="pill-btn active" data-category="massa-muscular">Massa Muscular</button>
        <button class="pill-btn active" data-category="forca-creatina">Força & Creatina</button>
        <button class="pill-btn active" data-category="emagrecimento">Emagrecimento</button>
    </div>
</nav>

   <main>
    <section id="products-grid" class="products-grid">

    </section>
   </main>

   <button id="cart-toggle-btn" class="cart-floating-btn">🛒 <span id="cart-count">0</span></button>

    <aside id="cart-modal" class="cart-modal">
        <h2>Seu Carrinho</h2>
        <div id="cart-items"></div>
        <p>Total: <span id="cart-total">0 KZ</span></p>

        <input type="text" id="client-name" placeholder="Digite seu nome...">
        <input type="text" id="client-address" placeholder="Bairro / Endereço...">

        <button id="checkout-whatsapp-btn" class="whatsapp-btn">
            Finalizar Pedido via WhatsApp
        </button>
    </aside>

   <footer></footer>

   <script src="script.js"></script>
</body>
</html>
